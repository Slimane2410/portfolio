  <title>Slimane Aouanouk | Portfolio</title>

    (function () {
      var language = "en";
      try {
        language = sessionStorage.getItem("portfolio-language") === "fr" ? "fr" : "en";

        // English remains the default when storage is unavailable.
      }
      window.location.replace(language + "/index.html");
    }());
